<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>RouteWise — Roteamento Inteligente</title>
  <meta name="description" content="Otimize automaticamente a ordem de visita de múltiplas cidades e paradas." />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="map-region" aria-label="Mapa da rota">
      <div id="map"></div>
      <button id="open-panel" class="map-action" type="button" aria-controls="planner" aria-expanded="false">☰ Planejar rota</button>
    </section>

    <aside id="planner" class="planner" aria-label="Planejador de rota">
      <header class="planner-header">
        <div class="brand-mark" aria-hidden="true">🚚</div>
        <div class="brand-copy"><strong>RouteWise</strong><span>Roteamento &amp; Cargas</span></div>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Alternar tema">◐</button>
        <button id="close-panel" class="icon-button mobile-only" type="button" aria-label="Fechar painel">×</button>
      </header>

      <div class="search-block">
        <form id="search-form" class="search-row">
          <input id="search-input" autocomplete="off" placeholder="Cidade, bairro ou endereço" aria-label="Pesquisar local" />
          <button id="search-button" type="submit">Adicionar</button>
        </form>
        <div id="suggestions" class="suggestions" hidden></div>
        <p id="search-status" class="helper">Defina a origem e adicione as entregas.</p>
      </div>

      <section id="stops" class="stops" aria-live="polite">
        <div class="empty-state"><span>🚚</span><strong>Nenhuma parada</strong><small>Comece pela garagem ou centro de distribuição.</small></div>
      </section>

      <footer class="planner-footer">
        <div class="options">
          <div class="option-row">
            <span>Otimizar por</span>
            <div class="segmented" role="group" aria-label="Critério de rota">
              <button type="button" data-mode="distance" class="active">Distância</button>
              <button type="button" data-mode="time">Tempo</button>
            </div>
          </div>
          <label class="option-row switch-row"><span>Retornar à origem <small>Rota circular</small></span><input id="circular" type="checkbox" role="switch" /></label>
        </div>
        <div id="route-info" class="route-info" hidden></div>
        <p id="error" class="error" hidden></p>
        <button id="optimize" class="primary" type="button" disabled>⚡ Otimizar rota</button>
        <div id="share-actions" class="share-actions" hidden>
          <button id="maps" type="button">Google Maps</button>
          <button id="copy" type="button">Copiar link</button>
        </div>
        <button id="clear" class="clear" type="button" hidden>Limpar paradas</button>
      </footer>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
